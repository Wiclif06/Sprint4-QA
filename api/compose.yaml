services:
  mongo:
    image: mongo:8.0.26
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - petjourney_mongo_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  petjourney_mongo_dev:
